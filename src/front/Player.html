<script>
  let playersData = [];


  google.script.run
    .withSuccessHandler(function(players) {
      playersData = players;
      renderPlayerList();
    })
    .getPlayers();


  function renderPlayerList() {
    document
      .getElementById("liste")
      .innerHTML = playersData
        .map(buildPlayerCardHtml)
        .join("");
  }


  function buildPlayerCardHtml(player) {
    return `
      <div
        class="player-card"
        data-player-id="${escapeHtml(player.id)}"
      >
        <label class="player-select-area">
          <input
            class="player-select-checkbox"
            type="checkbox"
            value="${escapeHtml(player.id)}"
            onchange="updateStats()"
          >

          <span class="player-name">
            ${escapeHtml(player.name)}
          </span>
        </label>

        <button
          type="button"
          class="player-edit-button"
          aria-label="Edit ${escapeHtml(player.name)}"
          title="Edit player"
          onclick="
            openEditPlayerModal(
              event,
              this.closest('.player-card').dataset.playerId
            )
          "
        >
          ✎
        </button>
      </div>
    `;
  }


  function addPlayerToSelectionList(player) {
    playersData.push(player);

    document
      .getElementById("liste")
      .insertAdjacentHTML(
        "beforeend",
        buildPlayerCardHtml(player)
      );
  }


  function updatePlayerInSelectionList(
    updatedPlayer
  ) {
    const playerIndex =
      playersData.findIndex(player => {
        return String(player.id) ===
          String(updatedPlayer.id);
      });

    if (playerIndex !== -1) {
      playersData[playerIndex] = {
        ...playersData[playerIndex],
        ...updatedPlayer
      };
    }

    const card =
      Array.from(
        document.querySelectorAll(
          "#liste .player-card"
        )
      )
      .find(element => {
        return String(
          element.dataset.playerId
        ) === String(updatedPlayer.id);
      });

    if (!card) {
      return;
    }

    const nameElement =
      card.querySelector(".player-name");

    const editButton =
      card.querySelector(
        ".player-edit-button"
      );

    nameElement.textContent =
      updatedPlayer.name;

    editButton.setAttribute(
      "aria-label",
      `Edit ${updatedPlayer.name}`
    );
  }


  function updateStats() {
    const checked =
      document.querySelectorAll(
        "#liste " +
        ".player-select-checkbox:checked"
      );

    document
      .getElementById("count")
      .innerText = checked.length;
  }


  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
  }
</script>
