<div id="add-player-modal" class="modal-overlay hidden" role="dialog" aria-modal="true"
    aria-labelledby="add-player-title">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="add-player-title">
                Ajouter un joueur
            </h2>

            <button type="button" class="btn-icon" onclick="closeAddPlayerModal()" aria-label="Fermer">
                ✕
            </button>
        </div>

        <form id="add-player-form" onsubmit="submitAddPlayer(event)">
            <label class="form-field">
                <span>Nom du joueur</span>

                <input id="new-player-name" name="name" type="text" maxlength="80" required autocomplete="off">
            </label>

            <div class="position-levels">

                <fieldset class="position-level">
                    <legend>Poste 1 — Niveau inchangé</legend>

                    <div class="position-options">
                        <label class="position-option">
                            <input type="checkbox" name="poste1" value="G" onchange="handlePositionChange(this)">
                            <span>G</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste1" value="DEF" onchange="handlePositionChange(this)">
                            <span>DEF</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste1" value="MIL" onchange="handlePositionChange(this)">
                            <span>MIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste1" value="AIL" onchange="handlePositionChange(this)">
                            <span>AIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste1" value="BUT" onchange="handlePositionChange(this)">
                            <span>BUT</span>
                        </label>
                    </div>
                </fieldset>


                <fieldset class="position-level">
                    <legend>Poste 2 — Petit malus</legend>

                    <div class="position-options">
                        <label class="position-option">
                            <input type="checkbox" name="poste2" value="G" onchange="handlePositionChange(this)">
                            <span>G</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste2" value="DEF" onchange="handlePositionChange(this)">
                            <span>DEF</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste2" value="MIL" onchange="handlePositionChange(this)">
                            <span>MIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste2" value="AIL" onchange="handlePositionChange(this)">
                            <span>AIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste2" value="BUT" onchange="handlePositionChange(this)">
                            <span>BUT</span>
                        </label>
                    </div>
                </fieldset>


                <fieldset class="position-level">
                    <legend>Poste 3 — Malus moyen</legend>

                    <div class="position-options">
                        <label class="position-option">
                            <input type="checkbox" name="poste3" value="G" onchange="handlePositionChange(this)">
                            <span>G</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste3" value="DEF" onchange="handlePositionChange(this)">
                            <span>DEF</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste3" value="MIL" onchange="handlePositionChange(this)">
                            <span>MIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste3" value="AIL" onchange="handlePositionChange(this)">
                            <span>AIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste3" value="BUT" onchange="handlePositionChange(this)">
                            <span>BUT</span>
                        </label>
                    </div>
                </fieldset>


                <fieldset class="position-level">
                    <legend>Poste 4 — Malus important</legend>

                    <div class="position-options">
                        <label class="position-option">
                            <input type="checkbox" name="poste4" value="G" onchange="handlePositionChange(this)">
                            <span>G</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste4" value="DEF" onchange="handlePositionChange(this)">
                            <span>DEF</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste4" value="MIL" onchange="handlePositionChange(this)">
                            <span>MIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste4" value="AIL" onchange="handlePositionChange(this)">
                            <span>AIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="poste4" value="BUT" onchange="handlePositionChange(this)">
                            <span>BUT</span>
                        </label>
                    </div>
                </fieldset>
            </div>

            <fieldset class="manual-rating-field">
              <legend>Note manuelle</legend>

              <div
                id="manual-star-rating"
                class="manual-star-rating"
                role="slider"
                aria-label="Note manuelle"
                aria-valuemin="0.5"
                aria-valuemax="5"
                aria-valuenow="0"
                tabindex="0"
                onclick="handleManualRatingClick(event)"
                onkeydown="handleManualRatingKeydown(event)"
              >
                <div class="manual-star-rating-base">★★★★★</div>
                <div
                  id="manual-star-rating-fill"
                  class="manual-star-rating-fill"
                  style="width: 0%;"
                >
                  ★★★★★
                </div>
              </div>

              <input
                type="hidden"
                id="new-player-note"
                name="manualNote"
                required
              >

              <div
                id="manual-note-value"
                class="manual-note-value"
              >
                Sélectionner une note
              </div>
            </fieldset>

            <div id="add-player-error" class="form-error hidden"></div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeAddPlayerModal()">
                    Annuler
                </button>

                <button id="submit-add-player" type="submit">
                    Ajouter
                </button>
            </div>
        </form>
    </div>
</div>

<script>
  let editingPlayerId = null;

  function openAddPlayerModal() {
    editingPlayerId = null;

    resetPlayerForm();
    updatePlayerFormMode();
    showPlayerModal();

    const hasDesktopPointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    if (hasDesktopPointer) {
      document
        .getElementById("new-player-name")
        .focus();
    }
  }

  function openEditPlayerModal(event, playerId) {
    event.preventDefault();
    event.stopPropagation();

    showLoader();

    google.script.run
      .withSuccessHandler(function(player) {
        hideLoader();

        editingPlayerId =
          String(player.id);

        resetPlayerForm();
        updatePlayerFormMode();
        populatePlayerForm(player);
        showPlayerModal();
      })
      .withFailureHandler(function(error) {
        hideLoader();

        window.alert(
          error.message ||
          "Impossible de charger le joueur."
        );
      })
      .getPlayerById(playerId);
  }

  function showPlayerModal() {
    document
      .getElementById("add-player-modal")
      .classList.remove("hidden");
  }

  function closeAddPlayerModal() {
    document
      .getElementById("add-player-modal")
      .classList.add("hidden");

    editingPlayerId = null;

    resetPlayerForm();
    updatePlayerFormMode();
  }

  function populatePlayerForm(player) {
    document.getElementById("new-player-name").value = player.name;

    setPositionLevelValues("poste1", player.poste1);

    setPositionLevelValues("poste2", player.poste2);

    setPositionLevelValues("poste3", player.poste3);

    setPositionLevelValues("poste4", player.poste4);

    setManualRating(Number(player.manualNote));

    document
    .querySelectorAll(
      "#add-player-form " +
      ".position-option input:checked"
    )
    .forEach(input => {
      handlePositionChange(input);
    });
  }


  function setPositionLevelValues(levelName, positions) {
    (positions || []).forEach(position => {
      const input =
        document.querySelector(
          `#add-player-form ` +
          `input[name="${levelName}"]` +
          `[value="${position}"]`
        );

      if (input) {
        input.checked = true;
      }
    });
  }

  function getSelectedPositions(levelName) {
      return Array.from(
          document.querySelectorAll(
              `input[name="${levelName}"]:checked`
          )
      ).map(input => input.value);
  }

  function handlePositionChange(changedInput) {
      const position = changedInput.value;

      const samePositionInputs = document.querySelectorAll(
          `.position-option input[value="${position}"]`
      );

      samePositionInputs.forEach(input => {
          if (input === changedInput) {
              return;
          }

          input.disabled = changedInput.checked;
      });
  }

  function resetPositionInputs() {
      document
          .querySelectorAll(".position-option input")
          .forEach(input => {
              input.checked = false;
              input.disabled = false;
          });
  }

  function resetPlayerForm() {
    document
      .getElementById("add-player-form")
      .reset();

    resetPositionInputs();
    resetManualRating();
    clearAddPlayerError();
  }

  function resetManualRating() {
    document
      .getElementById("new-player-note")
      .value = "";

    document
      .getElementById(
        "manual-star-rating-fill"
      )
      .style.width = "0%";

    document
      .getElementById(
        "manual-note-value"
      )
      .textContent =
        "Sélectionner une note";

    document
      .getElementById(
        "manual-star-rating"
      )
      .setAttribute(
        "aria-valuenow",
        "0"
      );
  }

  function updatePlayerFormMode() {
    const isEditing =
      editingPlayerId !== null;

    document
      .getElementById("add-player-title")
      .textContent =
        isEditing
          ? "Modifier le joueur"
          : "Ajouter un joueur";

    document
      .getElementById("submit-add-player")
      .textContent =
        isEditing
          ? "Enregistrer"
          : "Ajouter";
  }

  function submitAddPlayer(event) {
    event.preventDefault();

    clearAddPlayerError();

    const manualNoteValue =
      document
        .getElementById("new-player-note")
        .value;

    if (!manualNoteValue) {
      showAddPlayerError(
        "La note manuelle est obligatoire."
      );

      return;
    }

    const isEditing =
      editingPlayerId !== null;

    /*
    * Keep the ID independently because closing the
    * modal resets editingPlayerId.
    */
    const submittedPlayerId =
      editingPlayerId;

    const playerInput = {
      name: document
        .getElementById("new-player-name")
        .value,

      poste1: getSelectedPositions("poste1"),

      poste2: getSelectedPositions("poste2"),

      poste3: getSelectedPositions("poste3"),

      poste4: getSelectedPositions("poste4"),

      manualNote: Number(manualNoteValue)
    };

    if (isEditing) {
      playerInput.id =
        submittedPlayerId;
    }

    setAddPlayerLoading(true);

    const runner =
      google.script.run
        .withSuccessHandler(function(result) {
          setAddPlayerLoading(false);

          if (isEditing) {
            updatePlayerInSelectionList(
              result.player
            );

            invalidateGeneratedTeams();
          } else {
            addPlayerToSelectionList(
              result.player
            );
          }

          closeAddPlayerModal();
        })
        .withFailureHandler(function(error) {
          setAddPlayerLoading(false);

          showAddPlayerError(
            error.message ||
            "Une erreur est survenue."
          );
        });

    if (isEditing) {
      runner.updatePlayer(playerInput);
    } else {
      runner.addPlayer(playerInput);
    }
  }

  function handleManualRatingClick(event) {
    const ratingElement = event.currentTarget;
    const rect = ratingElement.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, x / rect.width));

    let value = Math.round(ratio * 10) / 2; // pas de 0,5

    if (value < 0.5) {
      value = 0.5;
    }

    if (value > 5) {
      value = 5;
    }

    setManualRating(value);
  }

  function setManualRating(value) {
    const input = document.getElementById("new-player-note");
    const fill = document.getElementById("manual-star-rating-fill");
    const text = document.getElementById("manual-note-value");
    const rating = document.getElementById("manual-star-rating");

    input.value = value;

    const percentage = (value / 5) * 100;
    fill.style.width = percentage + "%";

    const displayValue = value.toString().replace(".", ",");

    text.textContent = "Note sélectionnée : " + displayValue + " / 5";
    rating.setAttribute("aria-valuenow", value);
  }

  function resetManualRating() {
    document.getElementById("new-player-note").value = "";
    document.getElementById("manual-star-rating-fill").style.width = "0%";
    document.getElementById("manual-note-value").textContent = "Sélectionner une note";
    document.getElementById("manual-star-rating").setAttribute("aria-valuenow", "0");
  }

  function setAddPlayerLoading(isLoading) {
    const submitButton =
      document.getElementById(
        "submit-add-player"
      );

    submitButton.disabled =
      isLoading;

    if (isLoading) {
      submitButton.textContent =
        editingPlayerId !== null
          ? "Enregistrement..."
          : "Ajout...";

      return;
    }

    submitButton.textContent =
      editingPlayerId !== null
        ? "Enregistrer"
        : "Ajouter";
  }

  function showAddPlayerError(message) {
      const errorElement =
          document.getElementById(
              "add-player-error"
          );

      errorElement.textContent = message;
      errorElement.classList.remove("hidden");
  }


  function clearAddPlayerError() {
      const errorElement =
          document.getElementById(
              "add-player-error"
          );

      errorElement.textContent = "";
      errorElement.classList.add("hidden");
  }
</script>
