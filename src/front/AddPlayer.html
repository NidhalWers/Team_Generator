<div id="add-player-modal" class="modal-overlay hidden" role="dialog" aria-modal="true"
    aria-labelledby="add-player-title">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="add-player-title">
                Add a player
            </h2>

            <button type="button" class="btn-icon" onclick="closeAddPlayerModal()" aria-label="Close">
                ✕
            </button>
        </div>

        <form id="add-player-form" onsubmit="submitAddPlayer(event)">
            <label class="form-field">
                <span>Player name</span>

                <input id="new-player-name" name="name" type="text" maxlength="80" required autocomplete="off">
            </label>

            <div class="position-levels">

                <fieldset class="position-level">
                    <legend>Position 1 — No penalty</legend>

                    <div class="position-options">
                        <label class="position-option">
                            <input type="checkbox" name="position1" value="G" onchange="handlePositionChange(this)">
                            <span>G</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position1" value="DEF" onchange="handlePositionChange(this)">
                            <span>DEF</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position1" value="MIL" onchange="handlePositionChange(this)">
                            <span>MIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position1" value="AIL" onchange="handlePositionChange(this)">
                            <span>AIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position1" value="BUT" onchange="handlePositionChange(this)">
                            <span>BUT</span>
                        </label>
                    </div>
                </fieldset>


                <fieldset class="position-level">
                    <legend>Position 2 — Small penalty</legend>

                    <div class="position-options">
                        <label class="position-option">
                            <input type="checkbox" name="position2" value="G" onchange="handlePositionChange(this)">
                            <span>G</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position2" value="DEF" onchange="handlePositionChange(this)">
                            <span>DEF</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position2" value="MIL" onchange="handlePositionChange(this)">
                            <span>MIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position2" value="AIL" onchange="handlePositionChange(this)">
                            <span>AIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position2" value="BUT" onchange="handlePositionChange(this)">
                            <span>BUT</span>
                        </label>
                    </div>
                </fieldset>


                <fieldset class="position-level">
                    <legend>Position 3 — Medium penalty</legend>

                    <div class="position-options">
                        <label class="position-option">
                            <input type="checkbox" name="position3" value="G" onchange="handlePositionChange(this)">
                            <span>G</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position3" value="DEF" onchange="handlePositionChange(this)">
                            <span>DEF</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position3" value="MIL" onchange="handlePositionChange(this)">
                            <span>MIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position3" value="AIL" onchange="handlePositionChange(this)">
                            <span>AIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position3" value="BUT" onchange="handlePositionChange(this)">
                            <span>BUT</span>
                        </label>
                    </div>
                </fieldset>


                <fieldset class="position-level">
                    <legend>Position 4 — Large penalty</legend>

                    <div class="position-options">
                        <label class="position-option">
                            <input type="checkbox" name="position4" value="G" onchange="handlePositionChange(this)">
                            <span>G</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position4" value="DEF" onchange="handlePositionChange(this)">
                            <span>DEF</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position4" value="MIL" onchange="handlePositionChange(this)">
                            <span>MIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position4" value="AIL" onchange="handlePositionChange(this)">
                            <span>AIL</span>
                        </label>

                        <label class="position-option">
                            <input type="checkbox" name="position4" value="BUT" onchange="handlePositionChange(this)">
                            <span>BUT</span>
                        </label>
                    </div>
                </fieldset>
            </div>

            <fieldset id="manual-rating-field" class="manual-rating-field">
              <legend>Manual rating</legend>

              <div
                id="manual-star-rating"
                class="manual-star-rating"
                role="slider"
                aria-label="Manual rating"
                aria-valuemin="0.5"
                aria-valuemax="5"
                aria-valuenow="0"
                tabindex="0"
                onclick="handleManualRatingClick(event)"
                onkeydown="handleManualRatingKeydown(event)"
              >
                <div class="manual-star-rating-base">★★★★★</div>
                <div
                  id="manual-star-rating-fill"
                  class="manual-star-rating-fill"
                  style="width: 0%;"
                >
                  ★★★★★
                </div>
              </div>

              <input
                type="hidden"
                id="new-player-rating"
                name="manualRating"
                required
              >

              <div
                id="manual-rating-value"
                class="manual-rating-value"
              >
                Select a rating
              </div>
            </fieldset>

            <div id="add-player-error" class="form-error hidden"></div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeAddPlayerModal()">
                    Cancel
                </button>

                <button id="submit-add-player" type="submit">
                    Add
                </button>
            </div>
        </form>
    </div>
</div>

<script>
  let editingPlayerId = null;

  function openAddPlayerModal() {
    editingPlayerId = null;

    resetPlayerForm();
    updatePlayerFormMode();
    showPlayerModal();
    refreshPlayerFormAccess();

    const hasDesktopPointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    if (hasDesktopPointer) {
      document
        .getElementById("new-player-name")
        .focus();
    }
  }

  function openEditPlayerModal(event, playerId) {
    event.preventDefault();
    event.stopPropagation();

    showLoader();

    google.script.run
      .withSuccessHandler(function(player) {
        hideLoader();

        editingPlayerId =
          String(player.id);

        resetPlayerForm();
        updatePlayerFormMode();
        populatePlayerForm(player);
        showPlayerModal();
      })
      .withFailureHandler(function(error) {
        hideLoader();

        window.alert(
          error.message ||
          "Unable to load the player."
        );
      })
      .getPlayerById(playerId, getAdminSessionToken());
  }

  function showPlayerModal() {
    document
      .getElementById("add-player-modal")
      .classList.remove("hidden");
  }

  function closeAddPlayerModal() {
    document
      .getElementById("add-player-modal")
      .classList.add("hidden");

    editingPlayerId = null;

    resetPlayerForm();
    updatePlayerFormMode();
  }

  function populatePlayerForm(player) {
    document.getElementById("new-player-name").value = player.name;

    setPositionLevelValues("position1", player.position1);

    setPositionLevelValues("position2", player.position2);

    setPositionLevelValues("position3", player.position3);

    setPositionLevelValues("position4", player.position4);

    if (isAdmin() && player.manualNote != null) {
      setManualRating(Number(player.manualNote));
    } else {
      resetManualRating();
    }

    document
    .querySelectorAll(
      "#add-player-form " +
      ".position-option input:checked"
    )
    .forEach(input => {
      handlePositionChange(input);
    });
  }


  function setPositionLevelValues(levelName, positions) {
    (positions || []).forEach(position => {
      const input =
        document.querySelector(
          `#add-player-form ` +
          `input[name="${levelName}"]` +
          `[value="${position}"]`
        );

      if (input) {
        input.checked = true;
      }
    });
  }

  function refreshPlayerFormAccess() {
    const ratingField =
      document.getElementById(
        "manual-rating-field"
      );

    if (!ratingField) {
      return;
    }

    ratingField.classList.toggle(
      "hidden",
      !isAdmin()
    );

    if (!isAdmin()) {
      resetManualRating();
    }
  }

  function getSelectedPositions(levelName) {
      return Array.from(
          document.querySelectorAll(
              `input[name="${levelName}"]:checked`
          )
      ).map(input => input.value);
  }

  function handlePositionChange(changedInput) {
      const position = changedInput.value;

      const samePositionInputs = document.querySelectorAll(
          `.position-option input[value="${position}"]`
      );

      samePositionInputs.forEach(input => {
          if (input === changedInput) {
              return;
          }

          input.disabled = changedInput.checked;
      });
  }

  function resetPositionInputs() {
      document
          .querySelectorAll(".position-option input")
          .forEach(input => {
              input.checked = false;
              input.disabled = false;
          });
  }

  function resetPlayerForm() {
    document
      .getElementById("add-player-form")
      .reset();

    resetPositionInputs();
    resetManualRating();
    clearAddPlayerError();
  }

  function resetManualRating() {
    document
      .getElementById("new-player-rating")
      .value = "";

    document
      .getElementById(
        "manual-star-rating-fill"
      )
      .style.width = "0%";

    document
      .getElementById(
        "manual-rating-value"
      )
      .textContent =
        "Select a rating";

    document
      .getElementById(
        "manual-star-rating"
      )
      .setAttribute(
        "aria-valuenow",
        "0"
      );
  }

  function updatePlayerFormMode() {
    const isEditing =
      editingPlayerId !== null;

    document
      .getElementById("add-player-title")
      .textContent =
        isEditing
          ? "Edit player"
          : "Add a player";

    document
      .getElementById("submit-add-player")
      .textContent =
        isEditing
          ? "Save"
          : "Add";
  }

  function submitAddPlayer(event) {
    event.preventDefault();

    clearAddPlayerError();

    const manualRatingValue =
      document
        .getElementById("new-player-rating")
        .value;

    if (isAdmin() && !manualRatingValue) {
      showAddPlayerError(
        "The manual rating is required."
      );

      return;
    }

    const isEditing =
      editingPlayerId !== null;

    /*
    * Keep the ID independently because closing the
    * modal resets editingPlayerId.
    */
    const submittedPlayerId =
      editingPlayerId;

    const playerInput = {
      name: document
        .getElementById("new-player-name")
        .value,

      position1: getSelectedPositions("position1"),

      position2: getSelectedPositions("position2"),

      position3: getSelectedPositions("position3"),

      position4: getSelectedPositions("position4"),
    };

    if(isAdmin()) {
      playerInput.manualRating = Number(manualRatingValue)
    }

    if (isEditing) {
      playerInput.id =
        submittedPlayerId;
    }

    setAddPlayerLoading(true);

    const runner =
      google.script.run
        .withSuccessHandler(function(result) {
          setAddPlayerLoading(false);

          if (isEditing) {
            updatePlayerInSelectionList(
              result.player
            );

            invalidateGeneratedTeams();
          } else {
            addPlayerToSelectionList(
              result.player
            );
          }

          closeAddPlayerModal();
        })
        .withFailureHandler(function(error) {
          setAddPlayerLoading(false);

          showAddPlayerError(
            error.message ||
            "An error occurred."
          );
        });

    if (isEditing) {
      runner.updatePlayer(playerInput, getAdminSessionToken());
    } else {
      runner.addPlayer(playerInput, getAdminSessionToken());
    }
  }

  function handleManualRatingClick(event) {
    const ratingElement = event.currentTarget;
    const rect = ratingElement.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, x / rect.width));

    let value = Math.round(ratio * 10) / 2; // 0.5 increments

    if (value < 0.5) {
      value = 0.5;
    }

    if (value > 5) {
      value = 5;
    }

    setManualRating(value);
  }

  function setManualRating(value) {
    const input = document.getElementById("new-player-rating");
    const fill = document.getElementById("manual-star-rating-fill");
    const text = document.getElementById("manual-rating-value");
    const rating = document.getElementById("manual-star-rating");

    input.value = value;

    const percentage = (value / 5) * 100;
    fill.style.width = percentage + "%";

    const displayValue = value.toString();

    text.textContent = "Selected rating: " + displayValue + " / 5";
    rating.setAttribute("aria-valuenow", value);
  }

  function resetManualRating() {
    document.getElementById("new-player-rating").value = "";
    document.getElementById("manual-star-rating-fill").style.width = "0%";
    document.getElementById("manual-rating-value").textContent = "Select a rating";
    document.getElementById("manual-star-rating").setAttribute("aria-valuenow", "0");
  }

  function setAddPlayerLoading(isLoading) {
    const submitButton =
      document.getElementById(
        "submit-add-player"
      );

    submitButton.disabled =
      isLoading;

    if (isLoading) {
      submitButton.textContent =
        editingPlayerId !== null
          ? "Saving..."
          : "Adding...";

      return;
    }

    submitButton.textContent =
      editingPlayerId !== null
        ? "Save"
        : "Add";
  }

  function showAddPlayerError(message) {
      const errorElement =
          document.getElementById(
              "add-player-error"
          );

      errorElement.textContent = message;
      errorElement.classList.remove("hidden");
  }


  function clearAddPlayerError() {
      const errorElement =
          document.getElementById(
              "add-player-error"
          );

      errorElement.textContent = "";
      errorElement.classList.add("hidden");
  }
</script>
