<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 15px;
    background: #f5f7fa;
  }

  h2 {
    margin-bottom: 10px;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: white;
    padding: 10px 12px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid #ddd;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
  }

  .top-left {
    font-size: 35px;
    font-weight: 500;
  }

  .btn-generate {
    padding: 8px 14px;
    font-size: 14px;
    border-radius: 8px;
    border: none;
    background: #1a73e8;
    color: white;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .btn-generate:hover {
    background: #1557b0;
  }

  /* PLAYER LIST */
  #liste {
    display: grid;
    gap: 12px;
    margin-bottom: 20px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  }

  .player-card {
    position: relative;
    min-height: 100px;
    overflow: hidden;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: white;

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .player-card:hover {
    background: #eef4ff;
    border-color: #1a73e8;
  }

  .player-select-area {
    width: 100%;
    min-height: 100px;

    box-sizing: border-box;

    display: flex;
    align-items: center;
    gap: 12px;

    padding:
      14px
      64px
      14px
      14px;

    cursor: pointer;
  }

  .player-select-checkbox {
    flex-shrink: 0;

    transform: scale(1.5);
    cursor: pointer;
  }

  .player-card:has(.player-select-checkbox:checked) {
    background: #d2e3fc;
    border-color: #1a73e8;
  }

  .player-edit-button {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;

    width: 42px;
    height: 42px;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #cbd5e1;
    border-radius: 50%;

    background: #f8fafc;
    color: #475569;

    font-size: 20px;
    line-height: 1;
  }

  .player-edit-button:hover {
    background: #e2e8f0;
    color: #1d4ed8;

    transform: none;
  }

  .player-edit-button:active {
    background: #dbeafe;
  }

  .player-name {
    font-size: 40px;
    font-weight: 500;
  }

  button {
    width: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;

    border-radius: 999px;
    border: none;

    background: #1a73e8;
    color: white;

    cursor: pointer;
    transition: 0.2s ease;
  }

  button:hover {
    background: #1557b0;
    transform: translateY(-1px);
  }

  .hidden {
    display: none;
  }

  /* =====================================================
   TEAMS MODAL
   ===================================================== */

  body.modal-open {
    overflow: hidden;
  }

  .teams-modal-card {
    width: min(1100px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);

    display: flex;
    flex-direction: column;

    overflow: hidden;
    padding: 0;
  }

  .teams-modal-header {
    flex-shrink: 0;

    margin: 0;
    padding: 18px 20px;

    border-bottom: 1px solid #e2e8f0;
    background: white;
  }

  .teams-modal-subtitle {
    margin-top: 4px;

    color: #64748b;
    font-size: 13px;
  }

  .teams-result {
    min-height: 0;
    overflow-y: auto;

    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(280px, 1fr));

    gap: 15px;
    padding: 18px;

    background: #f8fafc;
  }

  .team {
    min-width: 0;
    padding: 16px;

    border: 1px solid #e2e8f0;
    border-radius: 12px;

    background: white;
    box-shadow:
      0 2px 8px rgba(15, 23, 42, 0.06);
  }

  .team-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 14px;
    padding-bottom: 10px;

    border-bottom: 1px solid #e2e8f0;
  }

  .team-header h3 {
    margin: 0;

    color: #0f172a;
    font-size: 19px;
  }

  .team-player-count {
    padding: 4px 8px;

    border-radius: 999px;
    background: #eff6ff;

    color: #1d4ed8;
    font-size: 12px;
    font-weight: 700;
  }

  .team-avg {
    margin-bottom: 14px;
    padding: 10px 12px;

    border-radius: 9px;
    background: #f1f5f9;

    color: #334155;
  }

  .team-average-line {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 3px 0;
    font-size: 13px;
  }

  .team-average-line strong {
    font-size: 14px;
  }

  .team-players {
    display: grid;
    gap: 5px;
  }

  .player-line {
    min-height: 38px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
    padding: 7px 8px;

    border-radius: 7px;
    font-size: 14px;
  }

  .player-line:nth-child(odd) {
    background: #f8fafc;
  }

  .team-player-identity {
    min-width: 0;

    display: flex;
    align-items: center;
    gap: 7px;
  }

  .team-player-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    color: #0f172a;
    font-weight: 600;
  }

  .team-player-position {
    flex-shrink: 0;

    padding: 3px 6px;

    border-radius: 5px;
    background: #e2e8f0;

    color: #475569;
    font-size: 11px;
    font-weight: 700;
  }

  .adjusted-rating {
    flex-shrink: 0;

    display: inline-flex;
    align-items: center;
    gap: 4px;

    color: #1a73e8;
    font-size: 13px;
    font-weight: 600;
  }

  .rating-diff {
    margin-left: 2px;
    padding: 2px 5px;

    border-radius: 5px;

    font-size: 11px;
    font-weight: 700;
  }

  .diff-positive {
    background: #dcfce7;
    color: #15803d;
  }

  .diff-negative {
    background: #fee2e2;
    color: #b91c1c;
  }

  .diff-neutral {
    background: #f1f5f9;
    color: #64748b;
  }

  .teams-modal-actions {
    flex-shrink: 0;

    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 9px;

    padding: 14px 20px;

    border-top: 1px solid #e2e8f0;
    background: white;
  }

  .adjusted-rating.hidden,
  .team-avg.hidden,
  .form-error.hidden {
    display: none;
  }

  .btn-danger-secondary {
    background: #fee2e2;
    color: #b91c1c;
  }

  .btn-danger-secondary:hover {
    background: #fecaca;
    color: #991b1b;
  }

  /* LOADER */
  .loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 5px solid #ccc;
    border-top: 5px solid #4CAF50;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 16px;
    background: rgba(15, 23, 42, 0.55);
  }

  .modal-overlay.hidden {
    display: none;
  }

  .modal-card {
    width: min(100%, 560px);
    max-height: calc(100vh - 32px);
    overflow-y: auto;

    padding: 20px;
    border-radius: 16px;
    background: white;

    box-shadow:
      0 20px 50px rgba(15, 23, 42, 0.25);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
  }

  .modal-header h2 {
    margin: 0;
  }

  .btn-icon {
    padding: 7px 10px;
    background: transparent;
    color: #475569;
    font-size: 18px;
  }

  .btn-icon:hover {
    background: #f1f5f9;
    color: #0f172a;
  }

  .btn-secondary {
    background: #e2e8f0;
    color: #1e293b;
  }

  .btn-secondary:hover {
    background: #cbd5e1;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 7px;

    margin-bottom: 15px;
  }

  .form-field>span {
    font-size: 14px;
    font-weight: 600;
    color: #334155;
  }

  .form-field input,
  .form-field select {
    width: 100%;
    box-sizing: border-box;

    min-height: 46px;
    padding: 10px 12px;

    border: 1px solid #cbd5e1;
    border-radius: 9px;

    background: white;
    color: #0f172a;
    font-size: 16px;
  }

  .form-field input:focus,
  .form-field select:focus {
    outline: 2px solid #bfdbfe;
    border-color: #2563eb;
  }

  .positions-grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit,
        minmax(180px, 1fr));

    gap: 0 12px;
  }

  .form-error {
    margin: 10px 0;
    padding: 10px 12px;

    border-radius: 8px;
    background: #fee2e2;
    color: #b91c1c;

    font-size: 14px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;

    margin-top: 20px;
  }

  button:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }

  @media (max-width: 600px) {
    .top-bar {
      align-items: flex-start;
      gap: 10px;
    }

    .top-right {
      flex-direction: column;
      align-items: stretch;
    }

    .modal-overlay {
      align-items: flex-end;
      padding: 0;
    }

    .modal-card {
      width: 100%;
      max-height: 92vh;

      border-radius: 18px 18px 0 0;
    }

    .positions-grid {
      grid-template-columns: 1fr 1fr;
    }

    .modal-actions {
      position: sticky;
      bottom: 0;

      padding-top: 12px;
      background: white;
    }

    .teams-modal-card {
      width: 100%;
      max-height: 94vh;

      border-radius: 18px 18px 0 0;
    }

    .teams-modal-header {
      padding: 15px 16px;
    }

    .teams-modal-subtitle {
      max-width: 260px;
    }

    .teams-result {
      grid-template-columns: 1fr;

      gap: 12px;
      padding: 12px;
    }

    .teams-modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;
      padding: 12px;
    }

    .teams-modal-actions button {
      width: 100%;
      justify-content: center;
    }

    #regenerate-teams-button {
      grid-column: 1 / -1;
    }

    .team {
      padding: 13px;
    }

    .team-header {
      margin-bottom: 10px;
    }

    .player-line {
      min-height: 42px;
      padding: 7px 6px;

      font-size: 13px;
    }

    .team-player-identity {
      gap: 5px;
    }

    .team-player-position {
      font-size: 10px;
    }

    .manual-star-rating-base,
    .manual-star-rating-fill {
      font-size: 32px;
      letter-spacing: 2px;
    }

    .manual-rating-value {
      font-size: 13px;
    }

    .player-edit-button {
      width: 46px;
      height: 46px;

      top: 8px;
      right: 8px;
    }

    .player-select-area {
      padding-right: 62px;
    }
  }

  .position-levels {
    display: grid;
    gap: 14px;
    margin-bottom: 16px;
  }

  .position-level {
    margin: 0;
    padding: 12px;

    border: 1px solid #cbd5e1;
    border-radius: 10px;

    background: #f8fafc;
  }

  .position-level legend {
    padding: 0 6px;

    color: #334155;
    font-size: 14px;
    font-weight: 700;
  }

  .position-options {
    display: grid;
    grid-template-columns:
      repeat(5, minmax(0, 1fr));

    gap: 8px;
  }

  .position-option {
    min-height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #cbd5e1;
    border-radius: 8px;

    background: white;
    cursor: pointer;

    transition:
      background 0.15s ease,
      border-color 0.15s ease,
      color 0.15s ease;
  }

  .position-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .position-option span {
    font-size: 14px;
    font-weight: 700;
    color: #475569;
  }

  .position-option:has(input:checked) {
    border-color: #2563eb;
    background: #dbeafe;
  }

  .position-option:has(input:checked) span {
    color: #1d4ed8;
  }

  .position-option:has(input:disabled) {
    opacity: 0.35;
    cursor: not-allowed;
    background: #e2e8f0;
  }

  /* =====================================================
   MANUAL STAR RATING
   ===================================================== */

  .manual-rating-field {
    margin: 0 0 15px;
    padding: 12px;

    border: 1px solid #cbd5e1;
    border-radius: 10px;

    background: #f8fafc;
  }

  .manual-rating-field legend {
    padding: 0 6px;

    color: #334155;
    font-size: 14px;
    font-weight: 700;
  }

  .manual-star-rating {
    position: relative;

    width: max-content;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .manual-star-rating-base,
  .manual-star-rating-fill {
    font-size: 36px;
    letter-spacing: 4px;
  }

  .manual-star-rating-base {
    color: #cbd5e1;
  }

  .manual-star-rating-fill {
    position: absolute;
    top: 0;
    left: 0;

    overflow: hidden;
    white-space: nowrap;
    color: #f59e0b;
    pointer-events: none;
  }

  .manual-star-rating:focus {
    outline: 2px solid #bfdbfe;
    outline-offset: 6px;
    border-radius: 8px;
  }

  .manual-rating-value {
    margin-top: 10px;

    color: #475569;
    font-size: 14px;
    font-weight: 600;
  }

  @media (max-width: 600px) {
    .position-options {
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
    }
  }

  @media (min-width: 601px) and (max-width: 900px) {
    .teams-result {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }
  }

  /* =====================================================
   ADMIN
   ===================================================== */

  .admin-login-card {
    width: min(100%, 420px);
  }

  .admin-only.hidden {
    display: none;
  }

  body.is-admin #admin-access-button {
    background: #dcfce7;
    color: #166534;
  }

  body.is-admin #admin-access-button:hover {
    background: #bbf7d0;
  }
</style>
