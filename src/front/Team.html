<!-- MODALE DES ÉQUIPES -->
<div id="teams-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="teams-modal-title"
  onclick="handleTeamsModalOverlayClick(event)">
  <div class="modal-card teams-modal-card">

    <div class="modal-header teams-modal-header">
      <div>
        <h2 id="teams-modal-title">
          ⚽ Équipes générées
        </h2>

        <div class="teams-modal-subtitle">
          Répartition optimisée des joueurs sélectionnés
        </div>
      </div>

      <button type="button" class="btn-icon" onclick="closeTeamsModal()" aria-label="Fermer les équipes" title="Fermer">
        ✕
      </button>
    </div>

    <div id="teams-modal-error" class="form-error hidden"></div>

    <div id="teams-result" class="teams-result"></div>

    <div class="teams-modal-actions">
      <button id="toggle-notes-button" type="button" class="btn-secondary" onclick="toggleNotes()">
        Analyser
      </button>

      <button type="button" class="btn-secondary" onclick="closeTeamsModal()">
        Fermer
      </button>

      <button id="regenerate-teams-button" type="button" onclick="regenererEquipes()">
        🔄 Régénérer
      </button>
    </div>

  </div>
</div>


<script>
  let teamsNotesVisible = false;


  /**
   * Génère les équipes à partir des joueurs actuellement cochés.
   */
  function generer() {
    const selectedIds = getSelectedPlayerIds();

    if (selectedIds.length < 7) {
      showGenerationError("⚠️ Minimum 7 joueurs requis.");
      return;
    }

    clearGenerationError();
    showLoader();

    google.script.run
      .withSuccessHandler(function (result) {
        hideLoader();

        if (result.error) {
          showGenerationError("⚠️ " + result.error);
          return;
        }

        afficherEquipes(result);
        openTeamsModal();
      })
      .withFailureHandler(function (error) {
        hideLoader();

        showGenerationError("⚠️ Une erreur est survenue : " + (error.message || error));
      })
      .genererEquipes(selectedIds);
  }


  /**
   * Régénère les équipes avec la sélection actuelle.
   */
  function regenererEquipes() {
    const selectedIds = getSelectedPlayerIds();

    if (selectedIds.length < 7) {
      showTeamsModalError("Minimum 7 joueurs requis.");
      return;
    }

    clearTeamsModalError();
    setRegenerateButtonLoading(true);
    showLoader();

    google.script.run
      .withSuccessHandler(function (result) {
        hideLoader();
        setRegenerateButtonLoading(false);

        if (result.error) {
          showTeamsModalError(result.error);
          return;
        }

        afficherEquipes(result);
      })
      .withFailureHandler(function (error) {
        hideLoader();
        setRegenerateButtonLoading(false);

        showTeamsModalError(
          error.message ||
          "Une erreur est survenue pendant la génération."
        );
      })
      .genererEquipes(selectedIds);
  }


  /**
   * Retourne les IDs des joueurs sélectionnés dans la page.
   */
  function getSelectedPlayerIds() {
    return Array
      .from(
        document.querySelectorAll(
          "#liste input[type='checkbox']:checked"
        )
      )
      .map(checkbox => checkbox.value);
  }


  /**
   * Construit l'affichage des équipes dans la modale.
   */
  function afficherEquipes(result) {
    const teams = result.teams;
    const rawAvg = result.rawAvg;
    const adjAvg = result.adjAvg;

    teamsNotesVisible = false;
    updateToggleNotesButton();

    let html = "";

    teams.forEach((team, teamIndex) => {
      html += `
        <section class="team">
          <div class="team-header">
            <h3>
              Équipe ${teamIndex + 1}
            </h3>

            <span class="team-player-count">
              ${team.length} joueur${team.length > 1 ? "s" : ""}
            </span>
          </div>

          <div class="team-avg hidden">
            <div class="team-average-line">
              <span>⭐ Moyenne brute</span>
              <strong>
                ${rawAvg[teamIndex].toFixed(2)} / 5
              </strong>
            </div>

            <div class="team-average-line">
              <span>🔥 Moyenne ajustée</span>
              <strong>
                ${adjAvg[teamIndex].toFixed(2)} / 5
              </strong>
            </div>
          </div>

          <div class="team-players">
      `;

      team.forEach(player => {
        const diff =
          player.noteAdj - player.noteRaw;

        let diffClass = "diff-neutral";
        let diffText = "";

        if (diff > 0.01) {
          diffClass = "diff-positive";
          diffText = `+${diff.toFixed(2)}`;
        } else if (diff < -0.01) {
          diffClass = "diff-negative";
          diffText = diff.toFixed(2);
        }

        html += `
          <div class="player-line">
            <span class="team-player-identity">
              <span class="team-player-name">
                ${escapeTeamHtml(player.name)}
              </span>

              <span class="team-player-position">
                ${escapeTeamHtml(player.poste)}
              </span>
            </span>

            <span class="note-adj hidden">
              <strong>
                ${player.noteAdj.toFixed(2)}
              </strong>

              ${diffText
            ? `
                    <span
                      class="note-diff ${diffClass}"
                    >
                      ${diffText}
                    </span>
                  `
            : ""
          }
            </span>
          </div>
        `;
      });

      html += `
          </div>
        </section>
      `;
    });

    document
      .getElementById("teams-result")
      .innerHTML = html;
  }


  function openTeamsModal() {
    const modal =
      document.getElementById("teams-modal");

    modal.classList.remove("hidden");

    document.body.classList.add(
      "modal-open"
    );
  }


  function closeTeamsModal() {
    const modal =
      document.getElementById("teams-modal");

    modal.classList.add("hidden");

    document.body.classList.remove(
      "modal-open"
    );

    clearTeamsModalError();
  }


  /**
   * Ferme uniquement lorsque l'utilisateur clique sur le fond,
   * pas lorsqu'il clique dans la carte.
   */
  function handleTeamsModalOverlayClick(event) {
    if (event.target.id === "teams-modal") {
      closeTeamsModal();
    }
  }


  function toggleNotes() {
    teamsNotesVisible = !teamsNotesVisible;

    document
      .querySelectorAll(
        "#teams-modal .note-adj, " +
        "#teams-modal .team-avg"
      )
      .forEach(element => {
        element.classList.toggle(
          "hidden",
          !teamsNotesVisible
        );
      });

    updateToggleNotesButton();
  }


  function updateToggleNotesButton() {
    const button =
      document.getElementById(
        "toggle-notes-button"
      );

    if (!button) {
      return;
    }

    button.textContent =
      teamsNotesVisible
        ? "Masquer l'analyse"
        : "Analyser";
  }


  function setRegenerateButtonLoading(
    isLoading
  ) {
    const button =
      document.getElementById(
        "regenerate-teams-button"
      );

    button.disabled = isLoading;

    button.textContent =
      isLoading
        ? "Génération..."
        : "🔄 Régénérer";
  }


  function showTeamsModalError(message) {
    const errorElement =
      document.getElementById(
        "teams-modal-error"
      );

    errorElement.textContent = message;
    errorElement.classList.remove("hidden");
  }


  function clearTeamsModalError() {
    const errorElement =
      document.getElementById(
        "teams-modal-error"
      );

    errorElement.textContent = "";
    errorElement.classList.add("hidden");
  }


  /**
   * Affiche les erreurs de sélection dans la page principale.
   *
   * Cette fonction continue d'utiliser #result si cet élément existe.
   */
  function showGenerationError(message) {
    const resultElement =
      document.getElementById("result");

    if (resultElement) {
      resultElement.innerHTML = message;
      return;
    }

    window.alert(message);
  }


  function clearGenerationError() {
    const resultElement =
      document.getElementById("result");

    if (resultElement) {
      resultElement.innerHTML = "";
    }
  }


  function escapeTeamHtml(value) {
    const element =
      document.createElement("div");

    element.textContent =
      String(value ?? "");

    return element.innerHTML;
  }


  /**
   * Fermeture avec la touche Échap.
   */
  document.addEventListener(
    "keydown",
    function (event) {
      if (
        event.key === "Escape" &&
        !document
          .getElementById("teams-modal")
          .classList.contains("hidden")
      ) {
        closeTeamsModal();
      }
    }
  );
</script>
