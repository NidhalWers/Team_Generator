<!-- TEAMS MODAL -->
<div id="teams-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="teams-modal-title">
  <div class="modal-card teams-modal-card">

    <div class="modal-header teams-modal-header">
      <div>
        <h2 id="teams-modal-title">
          ⚽ Generated teams
        </h2>

        <div class="teams-modal-subtitle">
          Optimized distribution of selected players
        </div>
      </div>

      <button type="button" class="btn-icon" onclick="closeTeamsModal()" aria-label="Close teams" title="Close">
        ✕
      </button>
    </div>

    <div id="teams-modal-error" class="form-error hidden"></div>

    <div id="teams-result" class="teams-result"></div>

    <div class="teams-modal-actions">
      <button id="toggle-notes-button" type="button" class="btn-secondary" onclick="toggleNotes()">
        Analyze
      </button>

      <button type="button" class="btn-secondary" onclick="cancelGeneratedTeams()">
        Cancel
      </button>

      <button id="regenerate-teams-button" type="button" onclick="regenerateTeams()">
        🔄 Regenerate
      </button>
    </div>

  </div>
</div>


<script>
  let teamsNotesVisible = false;
  let hasGeneratedTeams = false;


  /**
   * Generates teams from the currently selected players.
   */
  function generate() {
    const selectedIds = getSelectedPlayerIds();

    if (selectedIds.length < 7) {
      showGenerationError("⚠️ At least 7 players are required.");
      return;
    }

    clearGenerationError();
    showLoader();

    google.script.run
      .withSuccessHandler(function (result) {
        hideLoader();

        if (result.error) {
          showGenerationError("⚠️ " + result.error);
          return;
        }

        displayTeams(result);
        openTeamsModal();
      })
      .withFailureHandler(function (error) {
        hideLoader();

        showGenerationError("⚠️ An error occurred: " + (error.message || error));
      })
      .generateTeams(selectedIds, getAdminSessionToken());
  }


  /**
   * Regenerates teams using the current selection.
   */
  function regenerateTeams() {
    const selectedIds = getSelectedPlayerIds();

    if (selectedIds.length < 7) {
      showTeamsModalError("At least 7 players are required.");
      return;
    }

    clearTeamsModalError();
    setRegenerateButtonLoading(true);
    showLoader();

    google.script.run
      .withSuccessHandler(function (result) {
        hideLoader();
        setRegenerateButtonLoading(false);

        if (result.error) {
          showTeamsModalError(result.error);
          return;
        }

        displayTeams(result);
      })
      .withFailureHandler(function (error) {
        hideLoader();
        setRegenerateButtonLoading(false);

        showTeamsModalError(
          error.message ||
          "An error occurred while generating teams."
        );
      })
      .generateTeams(selectedIds, getAdminSessionToken());
  }


  /**
   * Returns the IDs of the players selected on the page.
   */
  function getSelectedPlayerIds() {
    return Array
      .from(
        document.querySelectorAll(
          "#liste input[type='checkbox']:checked"
        )
      )
      .map(checkbox => checkbox.value);
  }


  /**
   * Builds the team display in the modal.
   */
  function displayTeams(result) {
    const teams = result.teams;
    const canAnalyze = result.canAnalyze === true;

    const rawAvg = result.rawAvg || [];
    const adjAvg = result.adjAvg || [];

    teamsNotesVisible = false;

    const analyzeButton =
      document.getElementById(
        "toggle-notes-button"
      );

    if (analyzeButton) {
      analyzeButton.classList.toggle(
        "hidden",
        !canAnalyze
      );
    }

    updateToggleNotesButton();

    let html = "";

    teams.forEach((team, teamIndex) => {
      html += `
        <section class="team">
          <div class="team-header">
            <h3>
              Team ${teamIndex + 1}
            </h3>

            <span class="team-player-count">
              ${team.length}
              player${team.length > 1 ? "s" : ""}
            </span>
          </div>
      `;

      /*
      * Ratings and averages are only rendered when
      * the backend explicitly allows analysis.
      */
      if (canAnalyze) {
        html += `
          <div class="team-avg hidden">
            <div class="team-average-line">
              <span>⭐ Raw average</span>

              <strong>
                ${rawAvg[teamIndex].toFixed(2)} / 5
              </strong>
            </div>

            <div class="team-average-line">
              <span>🔥 Adjusted average</span>

              <strong>
                ${adjAvg[teamIndex].toFixed(2)} / 5
              </strong>
            </div>
          </div>
        `;
      }

      html += `
        <div class="team-players">
      `;

      team.forEach(player => {
        let ratingHtml = "";

        if (canAnalyze) {
          const diff =
            player.adjustedRating -
            player.rawRating;

          let diffClass =
            "diff-neutral";

          let diffText = "";

          if (diff > 0.01) {
            diffClass =
              "diff-positive";

            diffText =
              `+${diff.toFixed(2)}`;
          } else if (diff < -0.01) {
            diffClass =
              "diff-negative";

            diffText =
              diff.toFixed(2);
          }

          ratingHtml = `
            <span class="adjusted-rating hidden">
              <strong>
                ${player.adjustedRating.toFixed(2)}
              </strong>

              ${
                diffText
                  ? `
                    <span
                      class="rating-diff ${diffClass}"
                    >
                      ${diffText}
                    </span>
                  `
                  : ""
              }
            </span>
          `;
        }

        html += `
          <div class="player-line">
            <span class="team-player-identity">
              <span class="team-player-name">
                ${escapeTeamHtml(player.name)}
              </span>

              <span class="team-player-position">
                ${escapeTeamHtml(player.position)}
              </span>
            </span>

            ${ratingHtml}
          </div>
        `;
      });

      html += `
          </div>
        </section>
      `;
    });

    document
      .getElementById("teams-result")
      .innerHTML = html;

    hasGeneratedTeams = true;

    updateReopenTeamsButton();
  }


  function openTeamsModal() {
    const modal =
      document.getElementById("teams-modal");

    modal.classList.remove("hidden");

    document.body.classList.add(
      "modal-open"
    );
  }


  function closeTeamsModal() {
    const modal =
      document.getElementById("teams-modal");

    modal.classList.add("hidden");

    document.body.classList.remove(
      "modal-open"
    );

    clearTeamsModalError();
  }

  function cancelGeneratedTeams() {
    document
      .getElementById("teams-result")
      .innerHTML = "";

    hasGeneratedTeams = false;
    teamsNotesVisible = false;

    updateToggleNotesButton();
    updateReopenTeamsButton();

    closeTeamsModal();
  }

  function toggleNotes() {
    teamsNotesVisible = !teamsNotesVisible;

    document
      .querySelectorAll(
        "#teams-modal .adjusted-rating, " +
        "#teams-modal .team-avg"
      )
      .forEach(element => {
        element.classList.toggle(
          "hidden",
          !teamsNotesVisible
        );
      });

    updateToggleNotesButton();
  }


  function updateToggleNotesButton() {
    const button =
      document.getElementById(
        "toggle-notes-button"
      );

    if (!button) {
      return;
    }

    button.textContent =
      teamsNotesVisible
        ? "Hide analysis"
        : "Analyze";
  }

  function reopenTeamsModal() {
    if (!hasGeneratedTeams) {
      return;
    }

    openTeamsModal();
  }

  function updateReopenTeamsButton() {
    const button = document.getElementById(
      "reopen-teams-button"
    );

    if (!button) {
      return;
    }

    button.classList.toggle(
      "hidden",
      !hasGeneratedTeams
    );
  }

  function setRegenerateButtonLoading(
    isLoading
  ) {
    const button =
      document.getElementById(
        "regenerate-teams-button"
      );

    button.disabled = isLoading;

    button.textContent =
      isLoading
        ? "Generating..."
        : "🔄 Regenerate";
  }


  function showTeamsModalError(message) {
    const errorElement =
      document.getElementById(
        "teams-modal-error"
      );

    errorElement.textContent = message;
    errorElement.classList.remove("hidden");
  }


  function clearTeamsModalError() {
    const errorElement =
      document.getElementById(
        "teams-modal-error"
      );

    errorElement.textContent = "";
    errorElement.classList.add("hidden");
  }


  /**
   * Displays selection errors on the main page.
   *
   * This function continues to use #result when that element exists.
   */
  function showGenerationError(message) {
    const resultElement =
      document.getElementById("result");

    if (resultElement) {
      resultElement.innerHTML = message;
      return;
    }

    window.alert(message);
  }


  function clearGenerationError() {
    const resultElement =
      document.getElementById("result");

    if (resultElement) {
      resultElement.innerHTML = "";
    }
  }


  function escapeTeamHtml(value) {
    const element =
      document.createElement("div");

    element.textContent =
      String(value ?? "");

    return element.innerHTML;
  }


  /**
   * Closes with the Escape key.
   */
  document.addEventListener(
    "keydown",
    function (event) {
      if (
        event.key === "Escape" &&
        !document
          .getElementById("teams-modal")
          .classList.contains("hidden")
      ) {
        closeTeamsModal();
      }
    }
  );
</script>
