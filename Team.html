<script>
  function generer() {

    const checked = document.querySelectorAll("input[type='checkbox']:checked");
    let selectedIds = [];

    checked.forEach(cb => {
      selectedIds.push(cb.value);
    });

    if (selectedIds.length < 7) {
      document.getElementById("result").innerHTML =
        "⚠️ Minimum 7 joueurs requis.";
      return;
    }

    showLoader(); 

    google.script.run
      .withSuccessHandler(function(result) {
          hideLoader();
          
          if (result.error) {
            document.getElementById("result").innerHTML = "⚠️ " + result.error;
            return;
          }
        afficherEquipes(result);
      })
      .genererEquipes(selectedIds);
  }

  function afficherEquipes(result) {

    const teams = result.teams;
    const rawAvg = result.rawAvg;
    const adjAvg = result.adjAvg;

    let html = "<h3>Equipes générées</h3>";
    

    teams.forEach((team, index) => {

      html += "<div class='team'>";
      html += "<strong>Equipe " + (index + 1) + "</strong><br><br><br><br>";

      html += `
      <div class="hidden team-avg">
        ⭐ Moyenne brute : <strong>${rawAvg[index].toFixed(2)}</strong> / 5<br>
        🔥 Moyenne ajustée : <strong>${adjAvg[index].toFixed(2)}</strong> / 5
      </div>
      <br>
    `;

      team.forEach(player => {
        const diff = player.noteAdj - player.noteRaw;

        let diffClass = "diff-neutral";
        let diffText = "";

        if (diff > 0.01) {
          diffClass = "diff-positive";
          diffText = `(+${diff.toFixed(2)})`;
        } 
        else if (diff < -0.01) {
          diffClass = "diff-negative";
          diffText = `(${diff.toFixed(2)})`;
        }

        html += `
          <div class="player-line">
            ${player.name} (${player.poste})
            <span class="note-adj hidden">
              ⭐ ${player.noteAdj.toFixed(2)}
              <span class="note-diff ${diffClass}">
                ${diffText}
              </span>
            </span>
          </div>
        `;
      });

      html += "</div>";
    });

    document.getElementById("result").innerHTML = html;
  }

  function toggleNotes() {
    const notes = document.querySelectorAll(".note-adj, .team-avg");

    notes.forEach(n => {
      n.classList.toggle("hidden");
    });
  }
</script>
